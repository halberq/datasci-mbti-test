<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="client/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;1,700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Whats your MBTI?</title>
</head>
<body>

<header>
    <div class="logo">
        <nav>
        <button id="nav-quiz-btn">Quiz</button>
        <button id="nav-analytics-btn">Analytics</button>
        </nav>
        <img src="" alt="" class="logo-image">
    </div>
</header>

<!-- USERNAME PAGE -->
<section class="page active" id="page-username">
    <h1>Welcome!</h1>
    <p>Enter your name to begin.</p>
    <input type="text" id="username-input" placeholder="Your name">
    <button id="username-confirm-btn">Continue</button>
</section>

<!-- INTRO PAGE -->
<section class="page" id="page-intro">
    <h1 id="intro-greeting"></h1>
    <p>Answer a few questions to find out!</p>
    <button id="start-btn">Start Quiz</button>
</section>

<!-- QUIZ PAGE -->
<section class="page" id="page-quiz">
    <p id="question-progress"></p>
    <h2 id="question-text">

    </h2>
    <div id ="choices-container">
        
    </div>
</section>

<!-- RESULTS PAGE -->
<section class="page" id="page-result">
    <h2 id="result-message"></h2>
    <p id="result-type"></p>
    <button id="restart-btn">Restart Quiz</button>
</section>

<!-- ANALYTICS PAGE -->
 <section class="page" id="page-analytics">
    <h2>Live Results</h2>
    <p id="analytics-total"></p>
    <canvas id="analytics-chart"></canvas>
    <h2>Axis Breakdown</h2>
    <p id="axis-chart-total"></p>
    <canvas id="axis-chart"></canvas>
</section>

<script src="client/script.js"></script>

</body>
</html>
